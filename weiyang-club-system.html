<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>未央社 · 社团任务管理系统</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
if (typeof tailwind !== 'undefined') {
  tailwind.config = {
    theme: {
      extend: {
        /* ===== 深色主题色板：小色阶=深色表面/描边，大色阶=浅色文字 ===== */
        colors: {
          zinc: {
            50:'#0b0b0e', 100:'#1c1c23', 200:'#262630', 300:'#33333f',
            400:'#7e7e8c', 500:'#9494a2', 600:'#adadb9', 700:'#c6c6d1',
            800:'#dcdce4', 900:'#f1f1f5', 950:'#ffffff'
          },
          ink: { 950:'#000000', 900:'#f4f4f7', 800:'#d2d2dc', 700:'#3a3a45' },
          emerald: { 50:'rgba(52,211,153,.12)', 100:'rgba(52,211,153,.26)', 600:'#10b981' },
          amber:   { 50:'rgba(251,191,36,.13)', 100:'rgba(251,191,36,.26)' },
          blue:    { 50:'rgba(96,165,250,.13)', 100:'rgba(96,165,250,.26)' },
          red:     { 50:'rgba(248,113,113,.13)', 100:'rgba(248,113,113,.26)', 300:'rgba(248,113,113,.42)', 500:'#f87171' }
        },
        boxShadow: {
          soft:'0 1px 0 rgba(255,255,255,.055) inset, 0 2px 6px rgba(0,0,0,.28), 0 10px 26px -10px rgba(0,0,0,.50)',
          lift:'0 1px 0 rgba(255,255,255,.09) inset, 0 16px 44px -12px rgba(0,0,0,.62), 0 0 0 1px rgba(255,255,255,.07)'
        }
      }
    }
  };
}
</script>
<style>
  /* ==================== 设计令牌 ==================== */
  :root{
    color-scheme:dark;
    /* 玻璃：极低不透明度的冷灰，靠背景光斑"透"出层次 */
    --g-panel:   rgba(30,30,38,.52);
    --g-raised:  rgba(38,38,47,.62);
    --g-rail:    rgba(8,8,11,.66);
    --g-line:    rgba(255,255,255,.085);
    --g-line-hi: rgba(255,255,255,.22);
    /* 高级感强调色：冷蓝 + 淡紫，仅用于光晕/聚焦/激活，不铺满 */
    --accent:    #8ab4ff;
    --accent-2:  #c4b5fd;
    --aqua:      #7fe7f0;
    --txt-hi:    #f2f2f6;
    --txt-mid:   #a9a9b6;
    --txt-low:   #74747f;
  }

  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background-color:#08080b !important;
    /* 极光底：三团超大柔光，让玻璃有东西可折射 */
    background-image:
      radial-gradient(1100px 720px at 10% -12%, rgba(138,180,255,.15), transparent 62%),
      radial-gradient(900px 620px at 95% 2%,   rgba(196,181,253,.12), transparent 60%),
      radial-gradient(1000px 780px at 55% 112%, rgba(127,231,240,.085), transparent 62%);
    background-attachment:fixed;
  }
  /* 细颗粒噪点，消除大面积渐变的塑料感 */
  body::after{
    content:'';position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.035;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
  }
  body>*{position:relative;z-index:1}
  .is-hidden{display:none !important}
  [hidden]{display:none !important}
  .clamp-1{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  ::-webkit-scrollbar{width:7px;height:7px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.13);border-radius:99px}
  ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.24)}
  .fade-in{animation:fade .24s cubic-bezier(.22,1,.36,1)}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* ==================== 切屏转场 ==================== */
  #main{transform-origin:top center}
  /* 退场：轻上浮 + 淡出，短促利落 */
  .page-exit{animation:pageOut .17s cubic-bezier(.4,0,1,1) both;will-change:opacity,transform}
  @keyframes pageOut{
    from{opacity:1;transform:translate3d(0,0,0) scale(1);filter:blur(0)}
    to{opacity:0;transform:translate3d(0,-10px,0) scale(.992);filter:blur(3px)}
  }
  /* 进场：从下方浮现 + 解除模糊，营造"页面逐渐出现" */
  .page-enter{animation:pageIn .5s cubic-bezier(.22,1,.36,1) both;will-change:opacity,transform}
  @keyframes pageIn{
    from{opacity:0;transform:translate3d(0,18px,0) scale(.986);filter:blur(7px)}
    55%{filter:blur(0)}
    to{opacity:1;transform:translate3d(0,0,0) scale(1);filter:blur(0)}
  }
  /* 内容块逐个错峰浮现。
     刻意用独立的 translate 属性而非 transform：这样即使动画期间 hover，
     卡片自身的 hover:-translate-y 也能正常叠加，不会被动画锁死位移。 */
  .stg{animation:stgIn .52s cubic-bezier(.22,1,.36,1) both}
  @keyframes stgIn{
    from{opacity:0;translate:0 22px}
    to{opacity:1;translate:0 0}
  }
  /* 有分块错峰时容器只淡入，位移交给子块 */
  .page-enter-soft{animation:pageInSoft .34s ease-out both}
  @keyframes pageInSoft{
    from{opacity:0;filter:blur(6px)}
    to{opacity:1;filter:blur(0)}
  }
  /* 侧边栏激活胶囊淡入：配合光晕滑动，避免硬切 */
  .nav-active-in{animation:navIn .32s cubic-bezier(.22,1,.36,1) both}
  @keyframes navIn{from{opacity:0;transform:scale(.965)}to{opacity:1;transform:none}}

  /* 弹窗进出场：与切屏同一套缓动语言 */
  .modal-in{animation:modalIn .36s cubic-bezier(.22,1,.36,1) both}
  @keyframes modalIn{
    from{opacity:0;transform:translate3d(0,16px,0) scale(.962);filter:blur(7px)}
    58%{filter:blur(0)}
    to{opacity:1;transform:none;filter:blur(0)}
  }
  .modal-out{animation:modalOut .18s cubic-bezier(.4,0,1,1) both}
  @keyframes modalOut{
    to{opacity:0;transform:translate3d(0,8px,0) scale(.978);filter:blur(3px)}
  }
  .backdrop-in{animation:bdIn .3s ease-out both}
  @keyframes bdIn{from{opacity:0}to{opacity:1}}
  .backdrop-out{animation:bdOut .2s ease-in both}
  @keyframes bdOut{to{opacity:0}}

  /* 同页刷新：轻微脉冲，不做整屏重入 */
  .page-pulse{animation:pagePulse .34s cubic-bezier(.22,1,.36,1) both}
  @keyframes pagePulse{
    0%{opacity:.82;transform:scale(.994)}
    100%{opacity:1;transform:scale(1)}
  }
  /* 登录 ↔ 应用 的整屏转场 */
  .view-enter{animation:viewIn .58s cubic-bezier(.22,1,.36,1) both}
  @keyframes viewIn{
    from{opacity:0;transform:translate3d(0,16px,0) scale(.99);filter:blur(8px)}
    60%{filter:blur(0)}
    to{opacity:1;transform:none;filter:blur(0)}
  }
  @media (prefers-reduced-motion: reduce){
    .page-exit,.page-enter,.page-enter-soft,.stg,.page-pulse,.view-enter,.fade-in,
    .modal-in,.modal-out,.backdrop-in,.backdrop-out,.nav-active-in{animation:none !important}
    #navIndicator{transition:none !important}
  }

  /* ==================== 玻璃表面 ==================== */
  /* 所有卡片 / 面板 / 输入框：透明冷灰 + 背景模糊 + 顶部内高光 */
  .bg-white{
    background-color:var(--g-panel) !important;
    background-image:linear-gradient(168deg,rgba(255,255,255,.055) 0%,rgba(255,255,255,.012) 42%,rgba(255,255,255,0) 100%) !important;
    -webkit-backdrop-filter:blur(18px) saturate(155%) !important;
    backdrop-filter:blur(18px) saturate(155%) !important;
    border-color:var(--g-line) !important;
    box-shadow:0 1px 0 rgba(255,255,255,.07) inset, 0 2px 8px rgba(0,0,0,.26), 0 14px 40px -18px rgba(0,0,0,.70) !important;
  }
  .bg-white\/80{
    background-color:rgba(24,24,31,.58) !important;
    -webkit-backdrop-filter:blur(20px) saturate(150%) !important;
    backdrop-filter:blur(20px) saturate(150%) !important;
    border-color:var(--g-line) !important;
  }
  /* 顶栏与侧栏底部一条极细高光分割线 */
  .border-zinc-100,.border-zinc-200,.border-zinc-300{border-color:var(--g-line) !important}

  /* Logo 方块 / 侧边栏激活胶囊：保持亮面，不吃玻璃 */
  .bg-white.text-ink-950{
    background:#ffffff !important;background-image:none !important;
    -webkit-backdrop-filter:none !important;backdrop-filter:none !important;
    color:#000000 !important;
  }

  /* 侧边栏：比内容区更暗一档，层次拉开 */
  .bg-ink-950{
    background-color:var(--g-rail) !important;
    -webkit-backdrop-filter:blur(24px) saturate(140%) !important;
    backdrop-filter:blur(24px) saturate(140%) !important;
  }
  /* 内嵌块（聊天气泡、进度槽等）稍亮一档 */
  .bg-zinc-100{
    background-color:rgba(255,255,255,.062) !important;
    border-color:var(--g-line) !important;
  }

  /* ==================== 按钮：hover 出光晕，对比度拉高 ==================== */
  button,a,summary,[role="button"],label[class*="cursor-pointer"]{
    transition:box-shadow .26s cubic-bezier(.22,1,.36,1), background-color .2s ease,
               border-color .2s ease, color .2s ease, filter .2s ease, transform .16s ease;
  }

  /* 1) 主 CTA：亮面白，hover 时冷白光晕外扩 + 更亮（不是变灰） */
  .bg-ink-900.text-white{
    background:linear-gradient(180deg,#ffffff 0%,#e9e9f1 100%) !important;
    color:#08080b !important;
    border-color:transparent !important;
    box-shadow:0 1px 0 rgba(255,255,255,.9) inset, 0 4px 14px -4px rgba(255,255,255,.22), 0 2px 6px rgba(0,0,0,.45) !important;
  }
  .bg-ink-900.text-white:hover{
    background:linear-gradient(180deg,#ffffff 0%,#f6f6fb 100%) !important;
    box-shadow:0 0 0 1px rgba(255,255,255,.55),
               0 10px 30px -8px rgba(255,255,255,.40),
               0 0 26px -4px rgba(170,200,255,.42),
               0 3px 10px rgba(0,0,0,.50) !important;
    transform:translateY(-1px);
  }
  .bg-ink-900.text-white:active{transform:translateY(0) scale(.985)}

  /* 2) 中性按钮 / 表格行 / 列表项：hover 转"亮"而非"灰"，加白色微光 */
  .hover\:bg-zinc-50:hover,
  .hover\:bg-zinc-50\/60:hover,
  .hover\:bg-zinc-100:hover,
  .hover\:bg-white\/5:hover{
    background-color:rgba(255,255,255,.075) !important;
    box-shadow:0 0 0 1px rgba(255,255,255,.14),
               0 8px 24px -8px rgba(255,255,255,.16),
               0 2px 8px rgba(0,0,0,.32) !important;
  }
  button.hover\:bg-zinc-50:hover,a.hover\:bg-zinc-50:hover,
  button.hover\:bg-zinc-100:hover,a.hover\:bg-zinc-100:hover{color:var(--txt-hi) !important}
  .hover\:border-zinc-200:hover,
  .hover\:border-zinc-300:hover,
  .hover\:border-ink-900\/40:hover{border-color:var(--g-line-hi) !important}
  .hover\:border-ink-900:hover{border-color:rgba(255,255,255,.45) !important}

  /* 3) 语义色按钮：同色系光晕 + 提亮提饱和 */
  [class*="bg-emerald-600"]{
    background:linear-gradient(180deg,#3ddc9c,#12b981) !important;
    box-shadow:0 1px 0 rgba(255,255,255,.28) inset, 0 4px 12px -4px rgba(16,185,129,.42) !important;
  }
  [class*="bg-emerald-600"]:hover{
    filter:brightness(1.13) saturate(1.16);
    box-shadow:0 0 0 1px rgba(52,211,153,.55),
               0 10px 28px -8px rgba(52,211,153,.55),
               0 0 20px -4px rgba(52,211,153,.32) !important;
    transform:translateY(-1px);
  }
  /* 红色描边 / 危险操作 */
  [class*="border-red-200"],[class*="border-red-300"],[class*="text-red-500"][class*="border"]{
    border-color:rgba(248,113,113,.38) !important;
  }
  [class*="border-red-200"]:hover,[class*="border-red-300"]:hover{filter:brightness(1.12)}
  [class*="hover:bg-red-50"]:hover{
    background-color:rgba(248,113,113,.14) !important;
    box-shadow:0 0 0 1px rgba(248,113,113,.42),
               0 10px 26px -8px rgba(248,113,113,.40) !important;
  }

  /* 4) 兜底：任意按钮 hover 都给一圈冷白微光，杜绝"变灰"观感 */
  button:hover,a[class*="inline-flex"]:hover{
    box-shadow:0 0 0 1px rgba(255,255,255,.12),
               0 8px 22px -10px rgba(255,255,255,.20),
               0 2px 8px rgba(0,0,0,.30);
  }

  /* 角色选择卡：hover 出白光而非压黑 */
  .hover\:bg-ink-950:hover{
    background-color:rgba(255,255,255,.075) !important;
    box-shadow:0 0 0 1px rgba(255,255,255,.16),
               0 12px 30px -10px rgba(255,255,255,.20),
               0 2px 8px rgba(0,0,0,.34) !important;
  }
  /* 分割线在玻璃上要能看见 */
  .h-px.bg-zinc-200,.h-px.bg-zinc-100,.w-px.bg-zinc-200{background-color:rgba(255,255,255,.13) !important}

  /* 5) 聚焦环改为强调色，键盘可达性更高级 */
  [class*="focus:ring-ink-900"]:focus{
    box-shadow:0 0 0 3px rgba(138,180,255,.32), 0 0 18px -2px rgba(138,180,255,.35) !important;
    border-color:rgba(138,180,255,.55) !important;
  }
  input:focus,textarea:focus,select:focus{
    outline:none;
    border-color:rgba(138,180,255,.55) !important;
    box-shadow:0 0 0 3px rgba(138,180,255,.20), 0 0 20px -6px rgba(138,180,255,.45) !important;
    background-color:rgba(255,255,255,.055) !important;
  }

  /* ==================== 语义色 & 文字层级 ==================== */
  .text-amber-600,.text-amber-700{color:#fbbf24 !important}
  .text-emerald-600,.text-emerald-700{color:#34d399 !important}
  .text-blue-600{color:var(--accent) !important}
  .hover\:text-blue-600:hover{color:#a8ccff !important}
  .text-red-500{color:#f87171 !important}
  .hover\:text-red-500:hover{color:#fb8a8a !important}
  .text-zinc-200,.text-zinc-300{color:var(--txt-low) !important}
  .hover\:text-zinc-700:hover,.hover\:text-zinc-900:hover,
  .group:hover .group-hover\:text-zinc-500{color:var(--txt-hi) !important}
  .group:hover .group-hover\:text-white{color:#ffffff !important}

  /* ==================== 组件质感 ==================== */
  /* 卡片悬停：抬升 + 冷高光描边 + 深投影 */
  .hover\:shadow-lift:hover{
    box-shadow:0 1px 0 rgba(255,255,255,.10) inset,
               0 0 0 1px rgba(255,255,255,.13),
               0 22px 60px -18px rgba(0,0,0,.85),
               0 0 34px -14px rgba(138,180,255,.30) !important;
    border-color:var(--g-line-hi) !important;
  }
  .hover\:shadow-soft:hover{
    box-shadow:0 0 0 1px rgba(255,255,255,.12),
               0 14px 34px -14px rgba(0,0,0,.70),
               0 0 22px -10px rgba(138,180,255,.24) !important;
    border-color:var(--g-line-hi) !important;
  }
  /* 进度条槽 */
  .bg-zinc-100[class*="rounded-full"],.bg-zinc-200[class*="rounded-full"]{
    background-color:rgba(255,255,255,.085) !important;border-color:transparent !important;
  }
  /* Modal：玻璃更强，保证文字可读 */
  #modalRoot .bg-white{
    background-color:rgba(30,30,39,.90) !important;
    -webkit-backdrop-filter:blur(30px) saturate(160%) !important;
    backdrop-filter:blur(30px) saturate(160%) !important;
    box-shadow:0 0 0 1px rgba(255,255,255,.10), 0 40px 90px -20px rgba(0,0,0,.90) !important;
  }
  /* 遮罩 */
  [class*="bg-black"],[class*="bg-ink-950/"]{
    background-color:rgba(4,4,7,.62) !important;
    -webkit-backdrop-filter:blur(6px) !important;backdrop-filter:blur(6px) !important;
  }

  ::placeholder{color:#6a6a76 !important;opacity:1}
  input,textarea,select{color-scheme:dark}
  input,textarea,select{background-color:rgba(255,255,255,.045) !important;border-color:var(--g-line) !important}
  ::selection{background:rgba(138,180,255,.32);color:#fff}
</style>
</head>
<body class="bg-zinc-50 text-zinc-800 antialiased">
<!-- 路由切换顶部进度光带 -->
<div id="routeProgress" class="fixed top-0 left-0 right-0 h-[2px] z-[70] pointer-events-none overflow-hidden">
  <div id="routeProgressBar" class="h-full w-full origin-left scale-x-0 opacity-0"
       style="background:linear-gradient(90deg,rgba(138,180,255,0) 0%,#8ab4ff 22%,#ffffff 62%,#c9b6ff 100%);
              box-shadow:0 0 14px rgba(138,180,255,.75), 0 0 4px rgba(255,255,255,.9)"></div>
</div>

<!-- ==================== 登录页 ==================== -->
<div id="loginView" class="min-h-screen grid lg:grid-cols-2">

  <!-- 品牌区 -->
  <div class="relative hidden lg:flex flex-col justify-between bg-ink-950 p-12 overflow-hidden">
    <div class="absolute -top-32 -left-32 w-96 h-96 bg-white/[0.06] rounded-full blur-3xl"></div>
    <div class="absolute -bottom-40 -right-24 w-[28rem] h-[28rem] bg-blue-500/20 rounded-full blur-3xl"></div>
    <div class="absolute top-1/3 right-10 w-48 h-48 bg-emerald-400/10 rounded-full blur-3xl"></div>

    <div class="relative flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-white text-ink-950 flex items-center justify-center font-bold text-lg">未</div>
      <div class="leading-tight">
        <div class="text-white font-semibold">未央社</div>
        <div class="text-[11px] text-zinc-500 tracking-wide">WEIYANG CLUB · TASK OS</div>
      </div>
    </div>

    <div class="relative">
      <h1 class="text-4xl font-semibold text-white leading-tight tracking-tight">让社团协作<br/>井然有序。</h1>
      <p class="mt-4 text-sm text-zinc-400 leading-relaxed max-w-sm">从任务下发、子任务报名，到分工与产出审核，一条链路贯通主席团、部长与成员。</p>
      <div class="mt-10 space-y-4">
        <div class="flex items-start gap-3">
          <div class="w-8 h-8 rounded-lg bg-white/10 flex items-center justify-center text-white shrink-0" id="lf1"></div>
          <div><p class="text-sm text-white font-medium">分级权限</p><p class="text-xs text-zinc-500 mt-0.5">学号密码登录，按数据库权限进入对应端</p></div>
        </div>
        <div class="flex items-start gap-3">
          <div class="w-8 h-8 rounded-lg bg-white/10 flex items-center justify-center text-white shrink-0" id="lf2"></div>
          <div><p class="text-sm text-white font-medium">进度可视</p><p class="text-xs text-zinc-500 mt-0.5">三阶段进度实时标记，谁卡住一目了然</p></div>
        </div>
        <div class="flex items-start gap-3">
          <div class="w-8 h-8 rounded-lg bg-white/10 flex items-center justify-center text-white shrink-0" id="lf3"></div>
          <div><p class="text-sm text-white font-medium">产出闭环</p><p class="text-xs text-zinc-500 mt-0.5">上传—审核—确认/驳回，全程留痕</p></div>
        </div>
      </div>
    </div>

    <p class="relative text-[11px] text-zinc-600">© 2026 未央社 · 内部管理系统</p>
  </div>

  <!-- 表单区 -->
  <div class="flex items-center justify-center p-6 sm:p-12 bg-white">
    <div class="w-full max-w-sm">
      <div class="lg:hidden flex items-center gap-3 mb-8">
        <div class="w-10 h-10 rounded-xl bg-ink-950 text-white flex items-center justify-center font-bold text-lg">未</div>
        <div class="font-semibold text-zinc-900">未央社任务管理</div>
      </div>

      <h2 class="text-2xl font-semibold text-zinc-900 tracking-tight">登录</h2>
      <p class="text-sm text-zinc-500 mt-1.5 mb-8">使用学号与密码进入系统</p>

      <form onsubmit="event.preventDefault(); login('president');" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-zinc-700 mb-1.5">学号</label>
          <input type="text" value="202101001" class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-zinc-200 bg-white focus:outline-none focus:ring-2 focus:ring-ink-900/10 focus:border-ink-900 transition-shadow" />
        </div>

const TONES = {

  green:'bg-emerald-50 text-emerald-600',

  blue:'bg-blue-50 text-blue-600',

function badge(text, tone){
  return `<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[11px] font-medium ${TONES[tone]||TONES.zinc}">${text}</span>`;
}
function statusTone(s){
  if(['已确认','已同意','已通过','已完成'].includes(s)) return 'green';
  if(['待审核','待确认'].includes(s)) return 'amber';
  if(['已拒绝','已驳回'].includes(s)) return 'rose';
  if(['进行中','执行中'].includes(s)) return 'blue';
  return 'zinc';
}
function statusBadge(s){ return badge(s, statusTone(s)); }

function stepBar(stages){
  let out = '<div class="flex items-center">';
  stages.forEach((s,i)=>{
    const node = s.state==='done' ? 'bg-ink-900 text-white'
               : s.state==='active' ? 'bg-blue-500 text-white'
               : 'bg-zinc-200 text-zinc-400';
    const lbl = s.state==='active' ? 'text-blue-500 font-medium'
              : s.state==='done' ? 'text-zinc-500' : 'text-zinc-400';
    const inner = s.state==='done' ? '✓' : (i+1);
    out += `<div class="flex flex-col items-center w-12">
      <div class="w-6 h-6 rounded-full flex items-center justify-center text-xs ${node}">${inner}</div>
      <span class="text-[10px] mt-1 ${lbl} whitespace-nowrap">${s.name}</span>
    </div>`;
    if(i < stages.length-1){
      const line = s.state==='done' ? 'bg-ink-900' : 'bg-zinc-200';
      out += `<div class="flex-1 h-1 rounded-full mx-0.5 ${line}"></div>`;
    }
  });
  out += '</div>';
  return out;
}

  </div>`;

}
function closeModal(){
  const root = document.getElementById('modalRoot');
  if(!root.firstElementChild){ document.body.style.overflow = ''; return; }
  const my = ++modalToken;
  const panel = root.querySelector('.modal-in');
  const bd    = root.querySelector('.backdrop-in');
  if(!panel || REDUCED){ root.innerHTML = ''; document.body.style.overflow = ''; return; }
  panel.classList.remove('modal-in'); panel.classList.add('modal-out');
  if(bd){ bd.classList.remove('backdrop-in'); bd.classList.add('backdrop-out'); }
  setTimeout(()=>{
    if(my !== modalToken) return;     // 期间又开了新弹窗，别把新的清掉
    root.innerHTML = '';
    document.body.style.overflow = '';
  }, 190);
}

/* ---------- 动效偏好 ---------- */
const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- 顶部进度光带 ---------- */
function progressStart(){
  const bar = document.getElementById('routeProgressBar');
  if(!bar || REDUCED) return;
  bar.style.transition = 'none';
  bar.style.transform  = 'scaleX(0)';
  bar.style.opacity    = '1';
  void bar.offsetWidth;            // 强制回流，保证动画从头播放
  bar.style.transition = 'transform .52s cubic-bezier(.16,1,.3,1)';
  bar.style.transform  = 'scaleX(.78)';
}
function progressEnd(){
  const bar = document.getElementById('routeProgressBar');
  if(!bar || REDUCED) return;
  bar.style.transition = 'transform .24s cubic-bezier(.4,0,.2,1), opacity .4s ease .1s';
  bar.style.transform  = 'scaleX(1)';
  bar.style.opacity    = '0';
}

/* ---------- 登录 / 登出 ---------- */
function enterView(el){
  if(!el || REDUCED) return;
  el.classList.remove('view-enter');
  void el.offsetWidth;
  el.classList.add('view-enter');
}
function login(role){
  state.role = role;
  state.page = role==='member' ? 'hall' : 'dashboard';
  state.params = {};
  state.filter = '全部';
  progressStart();
  const lv  = document.getElementById('loginView');
  const app = document.getElementById('appView');
  const finish = function(){
    lv.classList.add('is-hidden');
    app.classList.remove('is-hidden');
    state.__anim = true;
    render();
    enterView(app);
    setTimeout(progressEnd, 340);
  };
  if(REDUCED){ finish(); return; }
  lv.classList.add('page-exit');                 // 登录页先淡出，再让后台浮现
  setTimeout(function(){ lv.classList.remove('page-exit'); finish(); }, 175);
}
function logout(){
  state.role = null; state.page = null; state.params = {};
  document.getElementById('appView').classList.add('is-hidden');
  const lv = document.getElementById('loginView');
  lv.classList.remove('is-hidden');
  enterView(lv);
  closeModal();
}

/* ---------- 带转场的路由 ---------- */
let navToken = 0;
function go(page, params){
  const main = document.getElementById('main');
  const samePage = state.page === page &&
                   JSON.stringify(state.params || {}) === JSON.stringify(params || {});
  state.page = page;
  state.params = params || {};

  // 同页重复点击：只做一次轻脉冲，避免整屏闪一下
  if(samePage){
    render();
    if(!REDUCED){
      main.classList.remove('page-pulse'); void main.offsetWidth;
      main.classList.add('page-pulse');
    }
    return;
  }

  if(REDUCED){
    render();
    try { window.scrollTo(0,0); } catch(e) {}
    return;
  }

  const token = ++navToken;
  progressStart();
  try { window.scrollTo(0,0); } catch(e) {}   // 转场中瞬移到顶，避免与淡入打架
  main.classList.remove('page-enter','page-pulse');
  main.classList.add('page-exit');

  setTimeout(()=>{
    if(token !== navToken) return;            // 期间又点了别的菜单，交给后一次
    state.__anim = true;
    render();
    main.classList.remove('page-exit');
    // 有分块错峰时，容器只做淡入，位移交给子块，避免两层位移叠加显得拖沓
    main.classList.add(state.__staggered ? 'page-enter-soft' : 'page-enter');
    setTimeout(()=>{
      if(token !== navToken) return;
      main.classList.remove('page-enter','page-enter-soft');
      progressEnd();
    }, 560);
  }, 170);
}

/* ---------- 内容块错峰浮现 ---------- */
function applyStagger(){
  state.__staggered = 0;
  const main = document.getElementById('main');
  const host = main && main.firstElementChild;
  if(!host) return;
  const kids = Array.prototype.slice.call(host.children);
  if(kids.length < 2) return;          // 单块内容直接整体淡入即可
  // 只让前 9 块错峰，其余跟随最后一块，避免长列表拖沓
  const span = Math.min(kids.length, 9);
  kids.forEach(function(el, i){
    el.classList.add('stg');
    el.style.animationDelay = (Math.min(i, span - 1) * 44) + 'ms';
    // 动画结束立刻摘掉：animation 的 both 会锁住 transform，否则卡片 hover 抬升会失效
    el.addEventListener('animationend', function done(){
      el.classList.remove('stg');
      el.style.animationDelay = '';
      el.removeEventListener('animationend', done);
    });
  });
  state.__staggered = kids.length;
  // 兜底清理（浏览器未派发 animationend 时）
  clearTimeout(window.__stgTimer);
  window.__stgTimer = setTimeout(clearStagger, 44 * span + 620);
}
function clearStagger(){
  const main = document.getElementById('main');
  if(!main) return;
  const list = main.querySelectorAll('.stg');
  for(let i=0;i<list.length;i++){
    list[i].classList.remove('stg');
    list[i].style.animationDelay = '';
  }
}

/* 侧边栏激活光晕：切换页面时平滑滑到当前项 */
function moveNavIndicator(){
  const ind = document.getElementById('navIndicator');
  const nav = document.getElementById('nav');
  if(!ind || !nav) return;
  const active = nav.querySelector('a[href="javascript:void(0)"]');
  const links  = nav.querySelectorAll('a');
  let target = null;
  for(let i=0;i<links.length;i++){
    if(links[i].className.indexOf('bg-white') !== -1){ target = links[i]; break; }
  }
  if(!active && !target) return;
  const el = target || active;
  const top = el.offsetTop, h = el.offsetHeight, w = el.offsetWidth, l = el.offsetLeft;
  if(!h || !w){ ind.style.opacity = '0'; return; }   // 布局未就绪时隐藏，绝不乱飞
  ind.style.width  = (w + 6) + 'px';
  ind.style.height = (h + 6) + 'px';
  ind.style.transform = 'translate3d(' + (l - 3) + 'px,' + (top - 3) + 'px,0)';
  ind.style.opacity = '1';
}

function isActive(key){
  if(state.page===key) return true;
  if(state.page==='task-detail' && key==='tasks') return true;
  if(state.page==='subtask-detail' && key==='subtasks') return true;

  return false;
}

function openThread(id){ state.params = { thread:id }; renderMain(); }

function sendMsg(threadId){
  const input = document.getElementById('chatInput');
  const text = (input.value||'').trim();
  if(!text) return;
  const th = DB.threads.find(t=>t.id===threadId);
  if(th){
    th.msgs.push({ from:'me', text, time:'刚刚' });
  }
  renderMain();
}

function stageRow(idx,name){
  return `<div class="stage-row flex items-center gap-2">
    <span class="w-6 text-center text-xs font-medium text-zinc-400">${idx}</span>
    <input type="text" value="${name}" placeholder="阶段名称" class="flex-1 px-3 py-2 text-sm rounded-lg border border-zinc-200 focus:outline-none focus:ring-2 focus:ring-ink-900/10 focus:border-ink-900" />
    <button type="button" onclick="removeStage(this)" class="w-8 h-8 shrink-0 rounded-lg hover:bg-red-50 text-zinc-300 hover:text-red-500 transition-colors flex items-center justify-center">${icon('trash','w-4 h-4')}</button>
  </div>`;
}
function addStage(){
  const list = document.getElementById('stageList');
  if(!list) return;
  const idx = list.children.length + 1;
  const div = document.createElement('div');
  div.innerHTML = stageRow(idx,'');
  list.appendChild(div.firstElementChild);
}
function removeStage(btn){
  const list = document.getElementById('stageList');
  if(!list || list.children.length<=1) return;
  btn.closest('.stage-row').remove();
  [...list.children].forEach((r,i)=>{ const s=r.querySelector('span'); if(s) s.textContent=i+1; });
}

function agreeSignup(subId, mid){
  const s = DB.subtasks.find(x=>x.id===subId);
  const x = s.signups.find(g=>g.mid===mid);
  if(x){ x.status='已同意'; toast('已同意该报名'); }
  renderMain();
}
function rejectSignup(subId, mid){
  const s = DB.subtasks.find(x=>x.id===subId);
  const x = s.signups.find(g=>g.mid===mid);
  if(x){ x.status='已拒绝'; toast('已拒绝该报名'); }
  renderMain();
}
function removeSignup(subId, mid){
  const s = DB.subtasks.find(x=>x.id===subId);
  s.signups = s.signups.filter(g=>g.mid!==mid);
  toast('已移出该成员');
  renderMain();
}
function assignDiv(subId, mid, val){
  const s = DB.subtasks.find(x=>x.id===subId);
  const x = s.signups.find(g=>g.mid===mid);
  if(x) x.div = val;
  toast('分工已更新为「'+val+'」');
}
function confirmOutput(id, approve){
  const o = DB.outputs.find(x=>x.id===id);
  if(o){ o.status = approve?'已通过':'已驳回'; toast(approve?'产出已确认通过':'产出已驳回'); }
  renderMain();
}
function setTaskStage(taskId, idx){
  const t = DB.tasks.find(x=>x.id===taskId);
  if(!t) return;
  t.cur = idx + 1;
  t.stages = t.stages.map((s,i)=>({ ...s, state: i<idx ? 'done' : (i===idx?'active':'todo') }));
  toast('已设置当前阶段为「'+t.stages[idx].name+'」');
  renderMain();
}
function setSubStage(subId, idx){
  const s = DB.subtasks.find(x=>x.id===subId);
  if(!s) return;
  s.stages = s.stages.map((st,i)=>({ ...st, state: i<idx ? 'done' : (i===idx?'active':'todo') }));
  toast('已设置当前阶段为「'+s.stages[idx].name+'」');
  renderMain();
}
